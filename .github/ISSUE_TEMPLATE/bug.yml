name: 🐞 Bug report
description: Something on the OpenStore site is broken or looks wrong.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The link of the page where it happens.
      placeholder: https://openstore.pfay.workers.dev/…
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [Phone, Tablet, Desktop or laptop]
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g. Chrome on Android, Safari on iPhone
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help.
